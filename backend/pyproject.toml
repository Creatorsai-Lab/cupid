[project]
name = "cupid-backend"
version = "0.1.2"
description = "Cupid - Multiagent ai content creation platform"
requires-python = ">=3.12,<3.13"

# Direct runtime dependencies only, pinned to tested versions. uv.lock pins the rest.
# Add or upgrade with `uv add <pkg>==<version>`; never edit uv.lock by hand.
dependencies = [
    # Web framework and server
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    # Database
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    # Cache, auth, encryption
    "redis==6.4.0",
    "python-jose==3.5.0",
    "cryptography==46.0.5",
    # Admin dashboard (sqladmin's login session needs itsdangerous but doesn't declare it)
    "sqladmin==0.27.2",
    "itsdangerous==2.2.0",
    # HTTP and web content extraction
    "httpx==0.28.1",
    "trafilatura==2.0.0",
    # trafilatura -> justext needs lxml's HTML cleaner; newer lxml skips the extra it requests
    "lxml-html-clean==0.4.4",
    "beautifulsoup4==4.14.3",
    # Agents and LLM providers
    "langgraph==1.1.3",
    "groq==0.37.1",
    # Used only by code being replaced (old agents, trends) — remove together with that code
    "langchain-core==1.3.0",
    "langchain-groq==1.1.2",
    "langsmith==0.7.22",
    "ddgs==9.13.1",
    "gnews==0.4.3",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit security rules
select = ["E", "F", "I", "N", "W", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests and evals use assert and fake credentials by design.
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["app", "tests", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped DB engine's connections
# belong to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Default run is fast and offline; opt in with `uv run pytest -m integration`.
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: calls real external services (LLM, search APIs); needs keys and network",
    "db: needs a Postgres test database",
]
