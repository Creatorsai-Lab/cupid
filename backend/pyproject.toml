[project]
name = "cupid-backend"
version = "0.1.2"
description = "Cupid - Multiagent ai content creation platform"
requires-python = ">=3.12,<3.13"

# Direct runtime dependencies only, pinned to tested versions. uv.lock pins the rest.
# Add or upgrade with `uv add <pkg>==<version>`; never edit uv.lock by hand.
dependencies = [
    # Web framework and server
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    # Database
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    # Cache, auth, encryption
    "redis==6.4.0",
    "python-jose==3.5.0",
    "cryptography==46.0.5",
    # Admin dashboard (sqladmin's login session needs itsdangerous but doesn't declare it)
    "sqladmin==0.27.2",
    "itsdangerous==2.2.0",
    # HTTP and web content extraction
    "httpx==0.28.1",
    "trafilatura==2.0.0",
    # trafilatura -> justext needs lxml's HTML cleaner; newer lxml skips the extra it requests
    "lxml-html-clean==0.4.4",
    "beautifulsoup4==4.14.3",
    # Agents and LLM providers
    "langgraph==1.1.3",
    "groq==0.37.1",
    # Used only by code being replaced (old agents, trends) — remove together with that code
    "langchain-core==1.3.0",
    "langchain-groq==1.1.2",
    "langsmith==0.7.22",
    "ddgs==9.13.1",
    "gnews==0.4.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.7",
    "mypy==1.19.1",
    "pre-commit==4.6.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pyrefly]
# ignore missing imports globally

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
