# Database | Purpose | What's stored
# ---
# 1. PostgreSQL | Permanent structured data | Users, profiles, posts, settings
# 2. Redis | Temporary cache/sessions | Rate limits, real-time data, job queues

services:
  postgres:
    image: postgres:16-alpine
    container_name: cupid_postgres
    environment:
      POSTGRES_USER: cupid
      POSTGRES_PASSWORD: cupid
      POSTGRES_DB: cupid_db
    ports:
      # host 5433: a native Postgres often already holds 5432.
      # 127.0.0.1: reachable from this machine only, not the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cupid -d cupid_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cupid_redis
    ports:
      # No password, so never publish beyond localhost.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
