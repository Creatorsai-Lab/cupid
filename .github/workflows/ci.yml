name: CI

# Run on every PR and on pushes to main. A red check blocks the merge button.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Ruff lint + format check + tests ────────────────
  backend:
    name: Backend (Ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      # Fast offline set (integration tests are deselected in pyproject.toml).
      - name: Tests (pytest)
        run: uv run pytest
        env:
          # Test-only value so Settings loads without a .env; not a real secret.
          SECRET_KEY: ci-only-test-key-not-a-real-secret-0123456789abcdef

  # ── Frontend: Prettier + ESLint + types + build ──────────────
  frontend:
    name: Frontend (Prettier · ESLint · tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
